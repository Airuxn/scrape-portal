name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff pip-audit

      - name: Ruff lint
        run: ruff check .

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile main.py discovery.py scraper.py ssrf.py safe_http.py \
            rate_limit.py quota_store.py robots_util.py url_scope.py language_dedupe.py \
            http_config.py api/index.py

      - name: Run tests
        run: pytest test_rate_limit.py test_security.py test_api.py -q

      - name: Sync tags to HEAD
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git tag -fa latest -m "Latest main"
          git push origin refs/tags/latest --force
