name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff pip-audit

      - name: Ruff lint
        run: ruff check .

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile main.py discovery.py scraper.py ssrf.py safe_http.py \
            rate_limit.py quota_store.py robots_util.py url_scope.py language_dedupe.py \
            http_config.py api/index.py

      - name: Run tests
        run: pytest test_rate_limit.py test_security.py test_api.py test_integration.py -q

  deploy:
    name: Deploy to Vercel
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for CodeQL
        uses: lewagon/wait-on-check-action@v1.53.0
        with:
          ref: ${{ github.sha }}
          check-regexp: ^Analyze \(
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success,skipped

      - uses: actions/checkout@v4

      - name: Deploy production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          working-directory: ./
